<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Geist+Mono:wght@400;500&display=swap">
<style>html,body{margin:0;background:#DCDAD3}a{color:#0E7F72}a:hover{color:#0B0C1C}</style>
</helmet>
<section style="padding:80px;display:flex;flex-direction:column;gap:56px;font-family:'Geist Mono',monospace;color:#14162E">
  <div id="1a" style="display:flex;flex-direction:column;gap:96px">
    <div style="display:flex;align-items:baseline;gap:20px;flex-wrap:wrap">
      <span style="background:#0B0C1C;color:#2FE0C8;padding:6px 10px;font-size:13px">1a</span>
      <h1 style="margin:0;font-family:'Newsreader',Georgia,serif;font-weight:300;font-size:56px;letter-spacing:-.02em">UDD Tunnel Lab — Dirección editorial de museo</h1>
      <span style="font-size:13px;color:#5A5C6E">Notebook 1440 × 900 · Celular 390 × 844 · cada pantalla es navegable y con scroll</span>
    </div>
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
      <div style="display:flex;flex-direction:column;gap:28px">
        <div style="display:flex;align-items:baseline;gap:20px;border-top:1px solid rgba(20,22,46,.25);padding-top:20px">
          <span style="font-size:13px;color:#5A5C6E">{{ r.n }}</span>
          <span style="font-family:'Newsreader',Georgia,serif;font-size:36px">{{ r.t }}</span>
          <span style="font-size:13px;color:#5A5C6E">{{ r.d }}</span>
        </div>
        <div style="display:flex;align-items:flex-start;gap:80px">
          <div style="flex:none">
            <div style="background:#141418;padding:18px 18px 22px;border-radius:22px 22px 0 0">
              <iframe src="{{ r.src }}" title="{{ r.t }} notebook" style="width:1440px;height:900px;border:0;display:block;background:#0B0C1C"></iframe>
            </div>
            <div style="width:1560px;margin-left:-42px;height:22px;background:#B9B7B0;border-radius:0 0 18px 18px"></div>
          </div>
          <div style="flex:none;background:#141418;padding:14px;border-radius:58px">
            <iframe src="{{ r.src }}" title="{{ r.t }} celular" style="width:390px;height:844px;border:0;display:block;border-radius:44px;background:#0B0C1C"></iframe>
          </div>
        </div>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { rows: [
      { n:'01', t:'Home', d:'Hero con foto del equipo, Chile protagonista, cuenta atrás', src:'Sitio.dc.html' },
      { n:'02', t:'Anatomía interactiva', d:'Sección 03 de la Home — tocar una zona abre su sala', src:'Sitio.dc.html?at=anatomia&zone=3' },
      { n:'03', t:'Álbum mecánico', d:'Página propia · 6 salas · cartelas de museo', src:'Sitio.dc.html?p=album' },
      { n:'04', t:'Vista ampliada', d:'Pieza con ficha completa · ← → para recorrer', src:'Sitio.dc.html?p=album&modal=0' },
      { n:'05', t:'Equipo', d:'Un equipo, un objetivo · fichas con frentes, frase fuerza, LinkedIn y correo', src:'Sitio.dc.html?p=equipo' },
      { n:'06', t:'Ficha flotante', d:'Perfil completo con descripción extensa', src:'Sitio.dc.html?p=equipo&person=0' },
    ] };
  }
}
</script>
</body>
</html>
