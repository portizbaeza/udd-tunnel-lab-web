<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Microtuneladora experimental</title>
  <desc id="desc">Ilustración semi-realista de una microtuneladora dentro de un túnel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6fbfe"/>
      <stop offset="1" stop-color="#dfeef6"/>
    </linearGradient>
    <radialGradient id="tunnel" cx="52%" cy="45%" r="58%">
      <stop offset="0" stop-color="#f7fbfd"/>
      <stop offset="0.58" stop-color="#cbd8df"/>
      <stop offset="1" stop-color="#7d8d99"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" x2="1">
